name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 26]
        scala: [2.13.x, 3.x]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{matrix.java}}
    - uses: sbt/setup-sbt@v1
    - name: Test
      run: sbt "++${{matrix.scala}}; testFull; mimaReportBinaryIssues; package"
